<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Graticule: offline</title>
<style>
  /* Self-contained on purpose. A page that exists to be shown when the network
     is gone cannot depend on a stylesheet fetch, and it must not depend on the
     Google Fonts link the main document uses. */
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh;
    display: grid; place-items: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 24px
             calc(env(safe-area-inset-bottom, 0px) + 24px);
    background: #0b0e13; color: #e6ecf3;
    font: 450 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .m { max-width: 30rem; }
  svg { width: 88px; height: 88px; opacity: 0.85; margin-bottom: 20px; }
  h1 { margin: 0 0 10px; font-size: 20px; font-weight: 550; letter-spacing: 0.2px; }
  p  { margin: 0 0 8px; color: #a8b3c2; font-size: 14px; }
  .hint { color: #8892a3; font-size: 13px; }
  button {
    margin-top: 22px; min-height: 44px; padding: 0 22px;
    background: rgba(92, 214, 255, 0.14);
    border: 1px solid #5cd6ff; border-radius: 8px;
    color: #e6ecf3; font: inherit; font-weight: 550; cursor: pointer;
  }
  button:hover { background: rgba(92, 214, 255, 0.22); }
</style>
</head>
<body>
  <div class="m">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="38" fill="#091822" stroke="#5cd6ff" stroke-width="2.4"/>
      <path d="M12 50h76M18 31h64M18 69h64" stroke="#5cd6ff" stroke-opacity=".45" stroke-width="1.4"/>
      <ellipse cx="50" cy="50" rx="19" ry="38" fill="none" stroke="#5cd6ff" stroke-opacity=".45" stroke-width="1.4"/>
      <path d="M50 12v76" stroke="#5cd6ff" stroke-width="1.8"/>
    </svg>
    <h1>No connection</h1>
    <p>Graticule reads live radar, satellite and alert feeds, so it needs a
       network to tell you anything current.</p>
    <p class="hint">Whatever was on screen last is still cached. This page will
       reload itself the moment the connection comes back.</p>
    <button type="button" onclick="location.replace('/')">Try again</button>
  </div>
<script>
  // Reload on reconnect rather than making someone tap a button they can't see
  // the point of. `replace` so the offline page does not sit in history.
  addEventListener('online', () => location.replace('/'));
</script>
</body>
</html>
