[project]
name = "graticule"
version = "0.1.0"
description = "Personal situational-awareness globe, live ships, planes, weather"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pywebview>=5.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=13",
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graticule"]
