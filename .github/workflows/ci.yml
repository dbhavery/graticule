name: ci

# This job used to be `pip install .` and `python -c "import graticule"`.
#
# It was green on every push and would have stayed green through every defect
# this project has ever had: the back button that exited the app, nine seconds
# of blocked main thread, a CC BY-NC-SA data file shipping uncredited inside
# the APK. A check that cannot fail proves nothing, and a green badge that
# proves nothing is worse than no badge, because it gets trusted.
#
# The five real suites need a live backend, a browser and the actual internet,
# so they are not run here. scripts/static_checks.py is everything that a plain
# file read can settle, and it carries its own controls.

on:
  push:
    branches: [dev, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install .

      - name: Import check
        run: python -c "import graticule"

      # Compiles every module rather than importing the package entry point,
      # so a syntax error in a feed nobody imports at startup is still caught.
      - name: Compile all sources
        run: python -m compileall -q graticule scripts

      - name: Static checks
        run: python scripts/static_checks.py
